<style>/* Macon Supper Club — editorial southern luxury */

/* ============ MODAL / CHECKOUT ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 25, 18, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  animation: fade .25s ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--cream);
  width: 100%;
  max-width: 1040px;
  max-height: 92vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  box-shadow: var(--shadow-lift);
  position: relative;
  animation: lift .35s cubic-bezier(.2,.7,.2,1);
}
.modal > * { min-width: 0; }
@keyframes lift { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-close {
  position: absolute;
  top: 18px;
  right: 18px;
  background: var(--cream);
  border: 2px solid var(--rule-strong);
  width: 44px;
  height: 44px;
  border-radius: 999px;
  cursor: pointer;
  z-index: 5;
  color: var(--forest);
  font-size: 22px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
.modal-close:hover { background: var(--cream-2); }

.modal-summary {

}

}
.modal-summary .ms-sub {

  letter-spacing: 0.42em;
  color: var(--gold-soft);
  margin-bottom: 36px;
}
.ms-sunday {
  font-family: var(--font-script);
  font-size: 46px;
  line-height: 1;
  color: var(--gold-soft);
}
.ms-date {

  font-size: 12px;

}
.ms-menu { font-size: 15px; line-height: 1.5; }
.ms-menu .item-name {

  letter-spacing: 0.18em;
  text-transform: uppercase;

}
.ms-menu .item-desc {

}

}
.ms-line {

  margin-bottom: 10px;

}
.ms-line.ms-line-fee {

  color: rgba(246, 241, 230, 0.62);

}
.ms-line.ms-line-fee .lbl {

/* form side */
.modal-form {
  padding: 36px 36px 32px;

  flex-direction: column;
  overflow-y: auto;
  min-width: 0;
}
.steps-strip {

}

}
.step-dot.active .num, .step-dot.done .num { background: var(--forest); color: var(--cream); border-color: var(--forest); }
.step-divider { flex: 1; height: 1px; background: var(--rule); }

.modal h3 {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 400;
  color: var(--forest);
  margin: 0 0 8px;
}
.modal .sub { color: var(--ink); font-size: 18px; margin-bottom: 28px; line-height: 1.5; }

.portion-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
.portion {
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: center;
  gap: 14px;

}
.portion:hover { border-color: var(--forest-soft); }

}
.radio-mark {

}

}
.portion.selected .radio-mark::after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 999px;
  background: var(--forest);
}
.portion-name {
  font-family: var(--font-display);
  font-size: 17px;
  letter-spacing: 0.04em;
  color: var(--forest);
}
.portion-desc { font-size: 15px; color: var(--ink); margin-top: 4px; line-height: 1.4; }
.portion-price { font-family: var(--font-display); font-size: 22px; color: var(--forest); white-space: nowrap; }

.qty-row {

}
.qty-row label {

  font-size: 12px;
  letter-spacing: 0.24em;

}
.qty-ctrl {

  border: 1px solid var(--rule-strong);
}
.qty-ctrl button {
  background: transparent;
  border: none;
  width: 48px;
  height: 48px;
  cursor: pointer;
  font-size: 22px;
  color: var(--forest);
  transition: background .15s;
}
.qty-ctrl button:hover { background: var(--cream-2); }
.qty-ctrl button:disabled { opacity: 0.3; cursor: not-allowed; }
.qty-ctrl .val {
  width: 52px;
  text-align: center;
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--forest);
}

.field-group { display: grid; gap: 14px; margin-bottom: 18px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--moss);
}
.field input, .field textarea, .field select {
  background: var(--paper);
  border: 2px solid var(--rule-strong);
  padding: 14px 14px;
  font-family: var(--font-body);
  font-size: 18px;
  color: var(--forest);
  outline: none;
  border-radius: 0;
  transition: border-color .15s, background .15s;
  min-height: 52px;
  width: 100%;
  box-sizing: border-box;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--forest);
  background: var(--cream);
}
.field.invalid input { border-color: #b04040; background: #fbeaea; }
.field-error {
  font-size: 15px;
  color: #8a2929;
  font-style: italic;
  margin-top: 4px;

}
.field textarea { resize: vertical; min-height: 72px; }

.allergen-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 8px;
}
.allergen-chip {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 0.06em;
  padding: 12px 6px;
  text-align: center;
  background: var(--paper);
  border: 2px solid var(--rule);
  cursor: pointer;
  color: var(--forest);
  transition: background .15s, border-color .15s;
  min-height: 44px;
  min-width: 0;
}
.allergen-chip:hover { border-color: var(--forest-soft); }
.allergen-chip.on {
  background: var(--forest);
  color: var(--cream);

}

.card-row {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 10px;
}
.card-brand-strip {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
}
.card-brand-strip .brand-chip {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.22em;
  padding: 5px 8px;
  border: 1px solid var(--rule);
  color: var(--moss);

}

.actions {
  display: flex;
  gap: 12px;
  margin-top: auto;
  padding-top: 24px;
}
.actions button { flex: 1; }
.btn-back {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  background: transparent;
  color: var(--forest);
  border: 2px solid var(--rule-strong);
  padding: 20px;
  cursor: pointer;
  flex: 0 0 auto;
  min-width: 130px;
  min-height: 60px;
  transition: background .15s;
}
.btn-back:hover { background: var(--cream-2); }
.btn-next {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  background: var(--forest);
  color: var(--cream);
  border: none;
  padding: 20px;
  cursor: pointer;
  transition: background .15s, transform .15s;
  min-height: 60px;
}
.btn-next:hover { background: var(--forest-deep); }
.btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-next .lock { font-size: 11px; margin-right: 8px; opacity: 0.8; }

/* success */
.success {
  padding: 60px 44px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  grid-column: 1 / -1;
}
.success-mark {
  width: 80px;
  height: 80px;
  border-radius: 999px;

  justify-content: center;
  font-size: 40px;
  margin: 0 auto 28px;

}
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.success h3 {
  font-family: var(--font-display);
  font-size: 44px;
  font-weight: 400;
  margin: 0 0 8px;
  color: var(--forest);
}
.success .script-flourish {
  font-family: var(--font-script);
  color: var(--forest-soft);

.success p { max-width: 520px; margin: 0 auto 14px; font-size: 20px; color: var(--ink); line-height: 1.55; }
.success-card {
  margin-top: 32px;

  padding: 24px 28px;
  border: 1px solid var(--rule);

}
.success-card .k {

  letter-spacing: 0.24em;

.success-card .v {

  font-size: 18px;
  color: var(--forest);

}

/* tiny shake */
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.shake { animation: shake .3s; }

/* ============ PROVENANCE STRIP ============ */

/* ============ SATURDAY 4PM EMPHASIS ============ */
.saturday-banner {

  align-items: center;
  gap: 14px;
  padding: 14px 20px;

.sb-dot {

/* deadline stamp + button as one composed unit */
.deadline-row {
  display: inline-flex;
  align-items: stretch;
  gap: 0;
  margin: 0 auto 0;
}
.deadline-row .deadline-stamp {
  margin: 0;
  border-right: none;
  padding: 16px 28px 14px;
}
.deadline-row .deadline-stamp::after {
  display: none;
}
.deadline-row .btn-primary {
  border-left: 2px solid var(--forest);
  padding: 0 38px;
  display: flex;
  align-items: center;
  white-space: nowrap;
}
.deadline-row .deadline-stamp::before { top: -7px; left: -7px; border-right: none; border-bottom: none; }

  .deadline-row { flex-direction: column; gap: 16px; }
  .deadline-row .deadline-stamp { border-right: 2px solid var(--forest); }
  .deadline-row .btn-primary { border-left: none; padding: 20px 30px; }
}

.deadline-stamp {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border: 2px solid var(--forest);
  padding: 18px 30px 16px;
  margin: 0 auto 28px;
  background: var(--paper);
  position: relative;
}
.deadline-stamp::before,
.deadline-stamp::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 2px solid var(--forest);
}
.deadline-stamp::before { top: -7px; left: -7px; border-right: none; border-bottom: none; }
.deadline-stamp::after { bottom: -7px; right: -7px; border-left: none; border-top: none; }
.ds-label {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.32em;
  color: var(--moss);
  text-transform: uppercase;
}
.ds-time {
  font-family: var(--font-display);
  font-size: 38px;
  color: var(--forest);
  line-height: 1;
  margin: 4px 0;
  letter-spacing: 0.08em;
}
.ds-time .ds-pm {
  font-size: 16px;
  letter-spacing: 0.2em;
  margin-left: 4px;
  vertical-align: middle;
}
.ds-note {
  font-size: 13px;
  color: var(--moss);
  font-style: italic;
}

/* ============ BRANDED CAROUSEL ============ */
.carousel {
  width: 100%;
  max-width: 1440px;
  margin: 40px auto 0;
  padding: 0 40px;
  position: relative;
}
.carousel-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: var(--forest-deep);
  box-shadow: var(--shadow-lift);
}
.carousel-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.2s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
.carousel-slide.on {
  opacity: 1;
  pointer-events: auto;
}
.carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: var(--forest-deep);
}
.carousel-shade {
